name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o server ./cmd/server

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t github-release-notification-api .

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test, build, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Create bundle
        run: |
          tar --exclude='.git' --exclude='.env' --exclude='coverage' \
            --exclude='terraform/.terraform' -czf /tmp/app.tgz .

      - name: Upload and restart stack
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          EC2_COMPOSE_FILE: ${{ secrets.EC2_COMPOSE_FILE }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${EC2_DEPLOY_PATH:-/opt/app/releases-api}"
          COMPOSE_FILE="${EC2_COMPOSE_FILE:-docker-compose.prod.yml}"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/app.tgz "${EC2_USER}@${EC2_HOST}:/tmp/app-deploy.tgz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" bash -s -- "$DEPLOY_PATH" "$COMPOSE_FILE" << 'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          COMPOSE_FILE="$2"
          sudo mkdir -p "$DEPLOY_PATH"
          sudo tar -xzf /tmp/app-deploy.tgz -C "$DEPLOY_PATH"
          sudo rm -f /tmp/app-deploy.tgz
          cd "$DEPLOY_PATH"
          sudo docker compose -f "$COMPOSE_FILE" up --build -d
          REMOTE
