# Config schema v2; requires golangci-lint 2.x.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - goconst
    - gocritic
    - revive
    - misspell
    - prealloc
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - vendor
    rules:
      - path: _test\.go
        linters:
          - goconst
          - gocritic

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - vendor
